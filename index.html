<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ashmore vs Ashmore</title>

<style>
/* Reset and body */
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: radial-gradient(circle, #111 0%, #000 70%);
  color: #fff;
  text-align: center;
}

/* All screens */
.screen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  width: 95%;
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.screen.active {
  display: flex !important; /* ensures all screens display when active */
}

/* Headings */
h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

h2 {
  margin-top: 10px;
}

/* Poster image */
#poster {
  display: block;
  margin: 15px auto;
  width: auto;
  max-width: 90%;
  height: auto;
  max-height: 600px;
  border-radius: 12px;
  box-shadow: 0 0 25px rgba(255,255,255,0.3);
  object-fit: contain;
}

/* Buttons */
.btn {
  padding: 15px 25px;
  font-size: 1.1rem;
  margin: 10px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: linear-gradient(145deg, #ffcc00, #ff9900);
  color: #000;
  font-weight: bold;
  transition: transform 0.2s;
}

.btn:hover {
  transform: scale(1.05);
}

/* Answers container */
.answers {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.answers button {
  width: 80%;
  max-width: 350px;
  margin: 8px auto;
}

/* Top bar */
.top-bar {
  display: flex;
  justify-content: space-between;
  width: 100%;
  font-size: 1rem;
  margin-bottom: 10px;
}

/* Question area */
.question-area {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
}

/* Popup */
.popup {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 10;
}

.popup-content {
  background: #111;
  padding: 30px;
  border-radius: 15px;
  font-size: 1.8rem;
  box-shadow: 0 0 30px rgba(255,255,255,0.4);
}

/* Result screen */
#resultScreen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  width: 100%;
  background: radial-gradient(circle at center, #222 0%, #000 80%);
  text-shadow: 0 0 10px #fff, 0 0 20px #ff0, 0 0 30px #ff0;
}

#resultScreen h1 {
  font-size: 4rem;
  color: #ffcc00;
  margin-bottom: 20px;
  text-shadow: 0 0 15px #ffcc00, 0 0 25px #ff9900;
}

#resultScreen h2 {
  font-size: 3rem;
  color: #fff;
  background: linear-gradient(90deg, #ff0, #ff9900);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 40px;
  text-shadow: 0 0 10px #fff;
}

#resultScreen .btn {
  font-size: 1.5rem;
  padding: 20px 40px;
  border-radius: 15px;
  background: linear-gradient(145deg, #ffcc00, #ff6600);
  box-shadow: 0 0 25px rgba(255, 200, 0, 0.7);
}

/* ====== Responsive adjustments ====== */
@media (min-width: 600px) {
  h1 { font-size: 3rem; }
  h2 { font-size: 2rem; }
  .answers button { font-size: 1.2rem; padding: 16px 30px; }
  #poster { max-width: 80%; max-height: 500px; }
}

@media (min-width: 900px) {
  h1 { font-size: 3.5rem; }
  h2 { font-size: 2.5rem; }
  .answers button { font-size: 1.3rem; padding: 18px 35px; }
  #poster { max-width: 70%; max-height: 600px; }
}

@media (min-width: 1200px) {
  h1 { font-size: 4rem; }
  h2 { font-size: 3rem; }
  .answers button { font-size: 1.4rem; padding: 20px 40px; }
  #poster { max-width: 60%; max-height: 650px; }
}
</style>
</head>

<body>

<!-- START SCREEN -->
<div id="startScreen" class="screen active">
  <h1>Ashmore vs Ashmore</h1>
  <img src="images/ashmore_brothers_start.jpg" alt="Ashmore Brothers" />
  <p>
    A movie & TV trivia game.<br><br>
    You’ll be shown a poster and title.<br>
    Decide if it stars <b>Shawn</b>, <b>Aaron</b>, or <b>Both</b>.<br><br>
    15 questions. 10 seconds each. No penalties.
  </p>
  <button class="btn" onclick="startGame()">Start Game</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="screen">
  <div class="top-bar">
    <div id="questionCounter">1 / 15</div>
    <div id="timer">⏱ 10</div>
    <div id="score">Score: 0</div>
  </div>

  <div class="question-area">
    <h2 id="title"></h2>
    <img id="poster" src="" alt="Poster" onerror="this.style.display='none'" />
    <div class="answers">
      <button class="btn" onclick="answer('Shawn')">Shawn</button>
      <button class="btn" onclick="answer('Aaron')">Aaron</button>
      <button class="btn" onclick="answer('Both')">Both</button>
    </div>
  </div>
</div>

<!-- RESULT SCREEN -->
<div id="resultScreen" class="screen">
  <h1>Results</h1>
  <h2 id="finalScore"></h2>
  <button class="btn" onclick="location.reload()">Play Again</button>
</div>

<!-- POPUP -->
<div id="popup" class="popup">
  <div class="popup-content" id="popupText"></div>
</div>

<script>
/* ===================== QUESTION POOL ===================== */
const QUESTION_POOL = [
  { title: "Fringe", img: "images/fringe.jpg", answer: "Both" },
  { title: "Smallville", img: "images/smallville.jpg", answer: "Both" },

  { title: "X-Men", img: "images/xmen.jpg", answer: "Shawn" },
  { title: "The Boys", img: "images/theboys.jpg", answer: "Shawn" },
  { title: "Animorphs", img: "images/animorphs.jpg", answer: "Shawn" },
  { title: "The Rookie", img: "images/therookie.jpg", answer: "Shawn" },
  { title: "Cadet Kelly", img: "images/cadetkelly.jpg", answer: "Shawn" },
  { title: "The Following", img: "images/thefollowing.jpg", answer: "Shawn" },
  { title: "Conviction", img: "images/conviction.jpg", answer: "Shawn" },
  { title: "Legend of Earthsea", img: "images/legendofearthsea.jpg", answer: "Shawn" },
  { title: "Acts of Violence", img: "images/actsofviolence.jpg", answer: "Shawn" },
  { title: "Darkness Falls", img: "images/darknessfalls.jpg", answer: "Shawn" },

  { title: "Ginny & Georgia", img: "images/ginnygeorgia.jpg", answer: "Aaron" },
  { title: "Locke & Key", img: "images/lockeandkey.jpg", answer: "Aaron" },
  { title: "Killjoys", img: "images/killjoys.jpg", answer: "Aaron" },
  { title: "Warehouse 13", img: "images/warehouse13.jpg", answer: "Aaron" },
  { title: "Are You Afraid of the Dark?", img: "images/areyouafraidofthedark.jpg", answer: "Aaron" },
  { title: "Veronica Mars", img: "images/veronicamars.jpg", answer: "Aaron" },
  { title: "My Brother's Keeper", img: "images/mybrotherskeeper.jpg", answer: "Aaron" },
  { title: "The West Wing", img: "images/westwing.jpg", answer: "Aaron" },
  { title: "SkyMed", img: "images/skymed.jpg", answer: "Aaron" },
  { title: "Wish Upon a Christmas", img: "images/wishuponachristmas.jpg", answer: "Aaron" }
];

/* ===================== SOUND EFFECTS ===================== */
const soundCorrect = new Audio("sounds/correct.mp3");
const soundWrong = new Audio("sounds/wrong.mp3");
const soundTimeout = new Audio("sounds/timeout.mp3");
[soundCorrect, soundWrong, soundTimeout].forEach(s => s.preload = "auto");

/* ===================== GAME STATE ===================== */
let questions = [];
let current = 0;
let score = 0;
let timer = 10;
let timerInterval;
let locked = false;

/* ===================== GAME FLOW ===================== */
function startGame() {
  questions = shuffle([...QUESTION_POOL]).slice(0, 15);
  current = 0;
  score = 0;
  showScreen("gameScreen");
  loadQuestion();
}

function loadQuestion() {
  if (current >= questions.length) {
    endGame();
    return;
  }
  locked = false;
  const q = questions[current];
  document.getElementById("title").textContent = q.title;
  const poster = document.getElementById("poster");
  poster.style.display = "block";
  poster.src = q.img;
  document.getElementById("questionCounter").textContent = `${current + 1} / ${questions.length}`;
  document.getElementById("score").textContent = `Score: ${score}`;
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timer = 10;
  document.getElementById("timer").textContent = `⏱ ${timer}`;
  timerInterval = setInterval(() => {
    timer--;
    document.getElementById("timer").textContent = `⏱ ${timer}`;
    if (timer === 0) {
      clearInterval(timerInterval);
      locked = true;
      soundTimeout.currentTime = 0;
      soundTimeout.play();
      showPopup(`⏰ Time's up!<br>Correct: ${questions[current].answer}`);
      nextQuestion();
    }
  }, 1000);
}

function answer(choice) {
  if (locked) return;
  locked = true;
  clearInterval(timerInterval);
  const correct = questions[current].answer;
  if (choice === correct) {
    score++;
    soundCorrect.currentTime = 0;
    soundCorrect.play();
    showPopup("✅ Correct!");
  } else {
    soundWrong.currentTime = 0;
    soundWrong.play();
    showPopup(`❌ Wrong<br>Correct: ${correct}`);
  }
  nextQuestion();
}

function nextQuestion() {
  setTimeout(() => {
    hidePopup();
    current++;
    loadQuestion();
  }, 1500);
}

function endGame() {
  document.getElementById("finalScore").textContent = `You scored ${score} / ${questions.length}`;
  showScreen("resultScreen");
}

/* ===================== HELPERS ===================== */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function showPopup(text) {
  document.getElementById("popupText").innerHTML = text;
  document.getElementById("popup").style.display = "flex";
}

function hidePopup() {
  document.getElementById("popup").style.display = "none";
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
</script>

</body>
</html>
